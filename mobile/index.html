<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#008080">
    <meta name="description" content="Tabboz Simulator - Versione Mobile">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/x-icon" href="../resources/icons/1.ico">
    <link rel="stylesheet" href="../resources/css/98.css">
    <link rel="stylesheet" href="../resources/css/novantotto.css">
    <link rel="stylesheet" href="css/mobile.css?v=18">
    <title>Tabboz Mobile</title>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-title">Tabboz Mobile</div>
            <div class="loading-subtitle">Caricamento simulatore...</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Avvio in corso...</div>
        </div>
    </div>

    <button class="save-manager-floating-btn" onclick="SaveManager.openModal()" title="Gestione Salvataggi">💾 Salvataggi</button>
    <div class="screen" id="screen"></div>
    <script src="js/mobile-bridge.js?v=18"></script>
    <script src="js/save-manager.js?v=18"></script>
    <script type="text/javascript">
    var Module = {
        locateFile: function(path, prefix) {
            if (path.endsWith('.wasm')) {
                return 'zarrosim.wasm';
            }
            return prefix + path;
        },
        postRun: [function() {
            if (typeof startGame === 'function') {
                startGame();
            }
        }],
        print: (text) => console.log(text),
        printErr: (text) => console.error(text),
    };

    // Clean up any stale service workers from previous versions
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
                registration.unregister();
            }
        });
    }
    </script>
    <script type="text/javascript" src="../zarrosim.js?v=18"></script>
</body>
</html>

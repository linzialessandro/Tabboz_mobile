<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#008080">
    <meta name="description" content="Tabboz Simulator - Versione Mobile">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/x-icon" href="../resources/icons/1.ico">
    <link rel="stylesheet" href="../resources/css/98.css">
    <link rel="stylesheet" href="../resources/css/novantotto.css">
    <link rel="stylesheet" href="css/mobile.css?v=13">
    <title>Tabboz Mobile</title>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-title">Tabboz Mobile</div>
            <div class="loading-subtitle">Caricamento simulatore...</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Avvio in corso...</div>
        </div>
    </div>

    <button class="save-manager-floating-btn" onclick="SaveManager.openModal()" title="Gestione Salvataggi">💾 Salvataggi</button>
    <div class="screen" id="screen"></div>
    <script src="js/mobile-bridge.js?v=13"></script>
    <script src="js/save-manager.js?v=13"></script>
    <script type="text/javascript">
    let gameStarted = false;
    function tryStartGame() {
        if (gameStarted) return;
        const start = (typeof _WinMainStartup === 'function' ? _WinMainStartup : null) ||
                      (typeof Module !== 'undefined' && typeof Module._WinMainStartup === 'function' ? Module._WinMainStartup : null);
        if (typeof start === 'function') {
            gameStarted = true;
            console.log('[Tabboz] Starting WinMain...');
            try {
                start();
            } catch (err) {
                console.error('[Tabboz] Error executing WinMainStartup:', err);
            }
        }
    }

    var Module = {
        locateFile: function(path, prefix) {
            if (path.endsWith('.wasm')) {
                return 'zarrosim.wasm';
            }
            return prefix + path;
        },
        onRuntimeInitialized: function() {
            tryStartGame();
        },
        postRun: [function() {
            tryStartGame();
        }],
        print: (text) => console.log(text),
        printErr: (text) => console.error(text),
    };

    // Fallback polling loop to guarantee startup regardless of device or network speed
    const startInterval = setInterval(() => {
        if (gameStarted) {
            clearInterval(startInterval);
        } else {
            tryStartGame();
        }
    }, 50);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').then(reg => {
            reg.update();
        }).catch(err => console.warn('SW registration:', err));
    }
    </script>
    <script async type="text/javascript" src="../zarrosim.js"></script>
</body>
</html>
